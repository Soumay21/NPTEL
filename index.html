<script>
const S=[
{t:"Section A: DL Basics, Hardware and Memory",h:215,q:[
[`Which of the following statement about Tensor is true:`,`1 and 2`,`A tensor is fundamentally an n-dimensional data container/array capable of GPU acceleration. It does not refer specifically to TensorFlow, as PyTorch and mathematics in general also define and use tensors.`],
[`Deep Learning Training is done in 64 bit precision`,`False`,`Standard deep learning training is typically conducted in 32-bit single precision (FP32) or mixed precision (FP16 / BF16 / FP8) to conserve memory and maximize throughput. 64-bit (double precision) is rarely, if ever, used.`],
[`Choose the correct statement:`,`It is observed empirically that increasing dataset also demands increase in model size to capture complex patterns`,`As data volume and diversity grow, scaling laws dictate that model capacity (parameters) must also scale to absorb and represent the added complexity without underfitting.`],
[`BERT Base Model has how many trainable model parameters?`,`Few Million`,`BERT-Base contains approximately 110 million parameters.`],
[`Which of the following frameworks supports GPU acceleration?`,`All of the above`,`PyTorch, TensorFlow, and MATLAB (via the Parallel Computing Toolbox) all support NVIDIA CUDA GPU acceleration.`],
[`Which of this is TRUE for Kubernetes`,`Open-source container orchestration tool`,`Kubernetes is specifically an open-source container orchestration platform designed to automate deploying, scaling, and managing containerized applications.`],
[`Which of this is a FALSE statement`,`GPU can be used to accelerate only DL Training and not inferencing`,`GPUs are widely utilized to accelerate both deep learning training and high-throughput/low-latency inference workloads.`],
[`Which of these is a GPU accelerated framework`,`DASK`,`Dask integrates directly with RAPIDS (dask-cuda / dask-cuDF) for distributed GPU computing, whereas standard Scikit-Learn, NumPy, and Pandas run natively on the CPU.`],
[`Which parallelism is best for scaling across multiple processors when the model is too large to fit in memory?`,`Model Parallelism`,`When an entire model cannot fit into a single GPU/processor's memory, the layers or tensor partitions of the model itself are divided across multiple devices using Model Parallelism (such as pipeline or tensor parallelism).`],
[`ONNX allows:`,`All of the above`,`The Open Neural Network Exchange (ONNX) format allows cross-framework model interoperability, running on heterogeneous hardware/platforms (CPU, GPU, cloud, edge), and inference optimization via runtimes like ONNX Runtime.`],
[`What is Memory Wall`,`The high latency difference between DRAM and CPU`,`The "Memory Wall" refers to the growing performance disparity between rapid CPU processing speeds and the relatively slow access latency/bandwidth of main memory (DRAM). Because the processor computes much faster than DRAM can deliver data, execution often stalls waiting for memory.`],
[`What is Re-Order buffer`,`Looks ahead for dependent & independent instructions in advance`,`In out-of-order execution processors, the Reorder Buffer (ROB) tracks instructions dynamically across pipeline stages. It allows instructions to execute speculatively and out of program order while ensuring results are committed sequentially (in-order) to preserve programmatic correctness.`],
[`For data level parallelism, which type of extensions are used in Modern systems?`,`SIMD`,`Modern processors use SIMD (Single Instruction, Multiple Data) vector extensions (such as AVX-512, NEON, or GPU compute cores) to apply a single arithmetic operation simultaneously across large vectors or arrays of data.`],
[`The left and right side of intersection of peak performance curve and peak memory bandwidht curve represents ?`,`Memory bound & compute intensive workload`,`In the Roofline Model, the horizontal line represents peak compute performance and the sloped line represents peak memory bandwidth. Workloads to the left of the inflection (elbow) point have low operational intensity and are memory-bound; workloads to the right have high arithmetic intensity and are compute-bound (compute intensive).`],
[`CPU cannot do transformation attention (large matrix multiplication). Why?`,`Because it is above the maximum compute performance of CPU`,`Transformer self-attention mechanisms require massive GEMM (General Matrix Multiply) throughput (O(N2) scaling with context length). The floating-point compute throughput of a CPU is orders of magnitude lower than specialized tensor accelerators on GPUs, placing it far above the CPU's peak compute capacity for practical workloads.`],
[`LLM inference and DNN training are`,`Memory Bound & Compute Bound`,`• LLM Inference (especially autoregressive token generation) requires loading billions of model parameters from high-bandwidth memory for each single token generated, making it primarily memory-bandwidth bound.\n• DNN Training processes large batches of data simultaneously, amortizing memory reads across matrix operations and pushing the processor to its peak arithmetic capability, making it compute bound.`],
[`DDR5 Memory have :`,`4800 - 6400 MT/s, 64 bit wide bus`,`Standard JEDEC DDR5 specifications operate in the 4800 to 6400+ MT/s range. A standard DDR5 DIMM maintains an overall 64-bit wide data bus (internally implemented as two independent 32-bit sub-channels for higher efficiency).`],
[`ECC (Error correcting code) Memory in AI servers do :`,`Detect double bit errors and correct single bit errors`,`Standard SECDED (Single Error Correction, Double Error Detection) ECC memory can automatically identify and correct any single-bit flip per memory word, while alerting the system to double-bit errors so corrupted data is not silently used.`],
[`In NUMA architecture (like DGX H100), accessing cross socket memoy adds around :`,`2x latency`,`In Non-Uniform Memory Access (NUMA) systems, accessing memory attached to a remote socket requires traversing interconnects (like UPI or Infinity Fabric), roughly doubling the memory access latency compared to accessing local socket memory.`],
[`Tick the correct option`,`Wraps is 32 threds executing same instruction on multiple data`,`In NVIDIA's SIMT (Single Instruction, Multiple Threads) architecture, a warp consists of 32 parallel threads executed synchronously on the same instruction across different data elements.`],
[`The precision in Tensor cores is _______ to TFLOPS`,`Inversly proportional`,`As numerical precision decreases (e.g., transitioning down from FP32 to FP16, BF16, or FP8/INT8), Tensor Cores can process exponentially more operations per clock cycle, yielding substantially higher TFLOPS throughput.`],
[`" torch.cuda.amp.autocast() " used to`,`Automatic Mixed Precision`,`In PyTorch, torch.cuda.amp.autocast() enables Automatic Mixed Precision, automatically casting specific operations to FP16 or BF16 to accelerate computation while retaining FP32 for precision-sensitive operations.`],
[`which type of advantage does the HBM3 have over H100 and AMD MI300X ?`,`Memory Bandwidth advantage`,`High Bandwidth Memory (HBM3/HBM3e) utilizes 3D-stacked DRAM dies on a silicon interposer with extremely wide data buses (1024 bits per stack), delivering terabytes-per-second memory bandwidth to alleviate memory-bound bottlenecking in AI accelerators.`],
[`What is the primary architectural bottleneck that NVIDIA's NVSwitch is designed to resolve?`,`The bandwidth and scalability limits of point-to-point NVLink connections across multiple GPUs`,`While point-to-point NVLink connections work well between a few adjacent GPUs, fully interconnecting 8 or more GPUs creates severe routing topology bottlenecks. NVSwitch acts as an on-node crossbar switch, providing full, all-to-all bidirectional line-rate communication across all GPUs.`],
[`Which of the following functions is NOT a CUDA Runtime API function`,`cuMemAlloc()`,`Functions prefixed with cu (such as cuMemAlloc) belong to the lower-level CUDA Driver API. Functions in the higher-level CUDA Runtime API are prefixed with cuda (e.g., cudaMalloc, cudaMemcpy, cudaFree).`]
]},
{t:"Section B: Docker, CUDA and GPU Sharing",h:190,q:[
[`Which of the following best describes the key structural difference between a Docker Image and a Container?`,`An image contains multiple layers and metadata, while a container is an instance of that image which adds its own writable layer, namespaces, and cgroups.`,`A Docker image is a read-only, immutable template built from layered filesystems. When launched, the runtime instantiates that image into a container by attaching an isolated user-space environment (using Linux namespaces for isolation, cgroups for resource limits) and mounting a thin read-write container layer on top via an overlay filesystem.`],
[`Why are layer caching and the ordering of steps considered critical when building large AI images?`,`They drastically reduce rebuild times (e.g., from 30 minutes to 30 seconds) by reusing unchanged filesystem diffs shared between images.`,`Docker checks cache sequentially from top to bottom. AI dependencies (CUDA runtimes, PyTorch, TensorRT) take gigabytes and tens of minutes to compile or download. Placing stable commands early and frequently changing application code toward the bottom avoids busting the cache, allowing Docker to reuse existing cached layers.`],
[`The driver version must be old enough for the toolkit in the image`,`False`,`NVIDIA drivers maintain backward compatibility, meaning the host GPU driver must be equal to or newer than the minimum driver version required by the CUDA Toolkit version bundled inside the container.`],
[`Does Docker gives us control to run any program on any specific available GPU?`,`True`,`Through the NVIDIA Container Toolkit and Docker flags (e.g., --gpus '"device=0,1"' or using the NVIDIA_VISIBLE_DEVICES environment variable), you can restrict container access to specific GPU devices.`],
[`What is the correct command to install nvidia container toolkit`,`Sudo apt-get install -y nvidia-container-toolkit`,`On Debian/Ubuntu distributions, the official NVIDIA package repository provides the toolkit under the package name nvidia-container-toolkit, which is installed using apt-get install -y nvidia-container-toolkit.`],
[`A Docker reproducibility bug occurs when local code hasn't changed, but "something changed in the resolver's world." Which scenario best exemplifies this?`,`An unpinned dependency or base image tag pulls a newer, breaking version during a fresh build.`,`If package dependencies (in requirements.txt) or base images (e.g., python:3.10 or :latest) use loose floating versions, rebuilding the container days or months later can resolve newer, incompatible transitive dependencies despite zero local source code edits.`],
[`Even after pinning human-readable tags, Docker builds can still suffer from reproducibility bugs. Which technique guarantees byte-level build reproducibility?`,`Referencing the base image by its immutable SHA-256 digest.`,`Human-readable tags (like ubuntu:22.04 or python:3.10-slim) can be updated and overwritten on the registry by image publishers. Specifying the cryptographic SHA-256 digest (e.g., image@sha256:...) guarantees identical, tamper-proof bitstreams across every build.`],
[`When using 'COPY --from=builder', what happens to the layers of the 'builder' stage in the final image?`,`They are completely excluded from the final image's manifest.`,`In multi-stage Docker builds, intermediate build stages are discarded. Only the explicit artifacts copied over with COPY --from=builder are included in the target stage's filesystem, discarding compiler toolchains, cache directories, and intermediate layers.`],
[`What is the correct command to generate a reproducible requirements.txt file with dependency hashes using the pip-tools suite?`,`Pip-compile --generate-hashes --output-file=requirements.txt requirements.in`,`In pip-tools, pip-compile takes an abstract .in file, resolves all sub-dependencies, and locks them. Specifying --generate-hashes appends cryptographic hashes (SHA-256) for each wheel/tarball, guaranteeing byte-level validation during pip install.`],
[`What is the Docker mechanism called when you link a specific, absolute path on your host hard disk directly to a path inside a container to persist your files even after the container is stopped?`,`Bind Mounts`,`A bind mount maps an exact file or directory path on the host machine directly into the container's virtual filesystem (e.g., -v /absolute/host/path:/container/path), bypassing the container's UnionFS and allowing persistent, real-time shared storage.`],
[`When using Unified Memory in CUDA, how does cudaMallocManaged handle memory management between the CPU and the GPU?`,`It allocates a single pointer accessible by both the CPU and GPU, automatically migrating data between them as needed.`,`cudaMallocManaged establishes a single coherent virtual memory address space. The underlying CUDA runtime and GPU page faulting mechanisms dynamically page memory pages between host DRAM and GPU VRAM over the PCIe or NVLink bus on demand.`],
[`When launching a CUDA kernel using the execution configuration syntax kernel <<< X , Y >>> , what do the parameters X and Y dictate to the GPU hardware?`,`X is the number of thread blocks in the grid, and Y is the number of parallel threads within each block.`,`In CUDA kernel launch syntax <<<gridDim, blockDim>>>, the first parameter (X) specifies the number of blocks comprising the grid, and the second (Y) defines the number of parallel threads running within each block.`],
[`Which GPU sharing mechanism provides strict hardware-level isolation, ensuring that dedicated memory and SMs are completely partitioned so one tenant cannot trigger an Out-of-Memory (OOM) error in another?`,`Multi-Instance GPU (MIG)`,`NVIDIA MIG (available on Ampere and newer architectures) physically partitions a single GPU into isolated GPU instances at the hardware level, allocating dedicated memory, crossbar paths, and Streaming Multiprocessors (SMs) with complete fault and QoS isolation.`],
[`What is a major isolation limitation when using CUDA Multi-Process Service (MPS) to share a GPU between different processes?`,`Memory is still shared, meaning a buggy process can corrupt another's memory or crash the entire MPS server.`,`While MPS aggregates CUDA contexts to allow co-scheduling across distinct OS processes, all clients share a common virtual address space context on the GPU. Consequently, memory violations, OOMs, or fatal GPU faults from one client can tear down the active MPS server and disrupt all co-located workloads.`],
[`How does gang scheduling solve the "stranded GPU" problem in multi-node clusters?`,`It ensures all required nodes launch simultaneously, allowing no partial allocations.`,`Distributed training jobs cannot begin until 100% of the worker nodes are available (all-or-nothing requirement). Gang scheduling ensures all requested pods/nodes are allocated together, preventing deadlocks where multiple jobs each hold a fraction of the cluster's GPUs while waiting indefinitely for the remainder.`]
]},
{t:"Section C: Kubernetes and Container Orchestration",h:265,q:[
[`In Container Orchestration, which phase of the orchestration process involves continuously comparing the user's declared target configuration (desired state) against what is currently running (actual state)?`,`It watches`,`In the course's framework for the reconciliation loop, the watching/observing phase ("It watches") continuously monitors and detects any drift between the declared desired state and the actual live runtime state.`],
[`Which internal Google system served as the original foundation for Kubernetes before it was open-sourced in 2014 and donated to the CNCF in 2015?`,`Borg`,`Kubernetes was designed by Google engineers and directly derived from Borg, Google's internal cluster management system.`],
[`In the Kubernetes control plane architecture, which component acts as "the only door in" by handling authentication, validation, and admission control?`,`API Server`,`The kube-apiserver is the front-end for the Kubernetes control plane. It acts as the central hub and primary entry point, intercepting and validating all REST requests before persisting state changes to etcd.`],
[`Which component on a Kubernetes Worker Node is responsible for configuring iptables or eBPF rules to ensure network traffic for Services properly routes to live Pod IPs?`,`kube-proxy`,`kube-proxy runs on every worker node and maintains network rules (using iptables, IPVS, or eBPF), translating virtual Service IPs into target pod endpoints.`],
[`Which of the following correctly describes how storage volumes and IP addresses are assigned to containers within a Pod?`,`A single Pod IP is shared by all containers in the Pod, and volumes can mount into any container in the Pod.`,`All containers within a single Pod share the same network namespace (a shared Pod IP address and localhost loopback) and can access the storage volumes defined in the Pod specification.`],
[`Which Kubernetes component is required to advertise a GPU as an extended resource to the scheduler?`,`Nvidia Device Plug-in`,`The NVIDIA Device Plugin is a DaemonSet that exposes available GPU counts as allocatable extended resources (nvidia.com/gpu) to the Kubernetes API server and scheduler.`],
[`What information is explicitly displayed inside the pod logs when running the gpu-smoke-working.yaml program successfully?`,`An nvidia-smi table format output`,`The smoke test pod executes nvidia-smi to confirm that the GPU drivers and CUDA container runtimes are functional, outputting the standard nvidia-smi hardware status table into the container logs.`],
[`Why are headless services configured specifically for stateful AI clusters instead of utilizing a default cluster IP address?`,`They map DNS lookups directly to individual pod IPs.`,`A Headless Service (clusterIP: None) bypasses virtual IP load balancing and directly returns the DNS SRV/A records of individual Pod IPs, allowing distributed AI nodes (such as PyTorch DDP rank nodes) to address and discover one another directly.`],
[`Which operational practice must be followed when managing sensitive access tokens like Hugging Face (HF) API keys?`,`Isolate and hold the sensitive data using Kubernetes Secrets.`,`Sensitive credentials should never be committed into source code, container layers, or plaintext ConfigMaps; they should be managed and mounted securely using Kubernetes Secrets.`],
[`Which directive is used within a container pod's manifest file to import all key-value configurations directly into the container's environment?`,`envFrom`,`The envFrom field in a container spec loads all key-value pairs from a referenced ConfigMap or Secret directly into the container's environment variables at runtime.`],
[`If a pod manifest references a Secret named ml-tokens via envFrom, what occurs if the create-secret.sh script has not been run first?`,`The pod gets stuck in a creation error state.`,`If a pod attempts to bind an environment configuration from a Secret or ConfigMap that does not exist in the namespace, pod startup fails, leaving it stuck in a CreateContainerConfigError state.`],
[`During the initial phase of the Canary rollout demonstration, how is the traffic split configured between the stable version and the canary version?`,`90% Stable / 10% Canary`,`In the course demonstration, the rollout begins conservatively by routing 90% of requests to the stable baseline deployment and 10% to the canary deployment.`],
[`What happens to the cluster IP mapping when all worker pods are clubbed together into a regular Virtual IP (VIP) service?`,`A single, unified Cluster IP is generated for the service.`,`Standard Kubernetes Services assign a single stable internal Virtual IP (ClusterIP) that load-balances incoming traffic across all matching backend pods.`],
[`When verifying the injected configuration inside the training pod, which command structure is used by the speaker to check the active environment variables?`,`kubectl exec -- env`,`Executing kubectl exec <pod-name> -- env runs the shell env command directly inside the container to print all loaded environment variables.`],
[`What is generated for three stateful set workers when configuring a Headless Service?`,`Separate, individual IP addresses for each worker pod.`,`Because a headless service does not allocate a single load-balanced cluster VIP, DNS queries resolve to the individual, distinct IP addresses of each pod in the StatefulSet.`]
]},
{t:"Section D: TensorFlow (Week 05, Assignment 05)",h:25,q:[
[`Which high-level API is used in TensorFlow for rapid model prototyping?`,`Keras API`,`Keras is integrated as TensorFlow's official high-level API (tf.keras), providing modular, user-friendly components for rapid model design and training.`],
[`What decorator is used in modern TensorFlow versions to convert eager code to graph execution?`,`@tf.function`,`Decorating a Python function with @tf.function traces the operations using AutoGraph to compile them into a callable, highly optimized TensorFlow computation graph.`],
[`How does TensorFlow's gradient tracking behavior during a standard gradient tape call differ from PyTorch's default zero_grad approach?`,`TensorFlow clears recorded states by default after a gradient call.`,`By default, calling tape.gradient() consumes and releases the resources held by the non-persistent tf.GradientTape, whereas PyTorch retains gradients and continually accumulates them on .grad buffers until zero_grad() is explicitly invoked.`],
[`What parameter must be explicitly configured in a TensorFlow gradient tape to successfully evaluate multiple loss functions sequentially without throwing an error?`,`persistent=True`,`Passing persistent=True to tf.GradientTape(persistent=True) instructs the tape to keep its recorded operations in memory across multiple calls to tape.gradient().`],
[`Which tensor type must be used in TensorFlow to prevent exceptions when trying to perform states or weight updates during training?`,`tf.variable`,`While standard tensors (tf.Tensor or tf.constant) are immutable, tf.Variable represents mutable state capable of in-place value updates (e.g., using .assign() or .assign_sub()) during optimization.`],
[`What is the primary advantage of executing a compiled C++ graph using tf.function over standard eager mode execution in TensorFlow 2.x?`,`Significant execution speedup for computations.`,`Graph execution eliminates Python interpreter overhead, enables inter-op parallel execution, and applies graph-level optimizations (constant folding, operator fusion), resulting in substantially faster runtime performance.`],
[`How does setting "num_parallel_calls=tf.data.AUTOTUNE" optimize the data pre-processing stage in a TensorFlow input pipeline?`,`It automatically balances workloads based on CPU cores and load.`,`tf.data.AUTOTUNE delegates thread-pool sizing and scheduling decisions to the tf.data runtime engine, dynamically tuning concurrency according to available CPU resources.`],
[`Why does a slow input data pipeline directly reduce overall GPU resource utilization during deep learning training?`,`It causes the GPU to sit idle waiting for data.`,`Deep learning accelerators execute batch matrix operations far faster than host storage/CPUs can parse raw data. If input pipeline throughput cannot saturate the model's consumption rate, the GPU stalls between steps.`],
[`During a multi-epoch training process, what behavior occurs in the second epoch if a dataset applies .map() for pre-processing without using .cache()?`,`TensorFlow re-executes the map routine calls entirely.`,`Without .cache(), the dataset pipeline evaluates transformations anew on every epoch iteration, needlessly repeating CPU-intensive decoding and transformation logic.`],
[`How can you explicitly prevent unnecessary graph retracing when passing inputs with varying shapes to a @tf.function decorated function?`,`By defining a custom input_signature with None dimensions.`,`Supplying an input_signature with tf.TensorSpec(shape=[None, ...]) informs TensorFlow to compile a single generalized polymorphic graph that handles variable batch or sequence lengths without retracing.`],
[`What is the specific TensorFlow graph equivalent for a standard Python if-else branch structure when building optimized control flows?`,`tf.cond`,`In static computation graphs, Python if/else conditions evaluate once during tracing. To evaluate conditions dynamically based on tensor values during execution, tf.cond is used.`],
[`During XLA's operator fusion, how are intermediate results stored to prevent High Bandwidth Memory (HBM) traffic?`,`In local registers`,`XLA (Accelerated Linear Algebra) fuses multiple element-wise kernels into a single GPU/accelerator kernel, streaming values directly across on-chip registers rather than writing and reading intermediate tensors to/from high-bandwidth memory.`],
[`When a model is serialized using TensorFlow's native model.export method for production, what is the primary structural role of the saved "serving signature"`,`It explicitly defines the input and output tensors required by inference APIs.`,`A serving signature (SignatureDef) specifies the named entry points, expected data types, and tensor shapes accepted and returned by production inference servers (e.g., TensorFlow Serving).`],
[`If you want to stay strictly within the Google ecosystem and deploy a machine learning model targeting highly resource-constrained mobile apps or edge devices, which framework should you convert your SavedModel to?`,`TensorFlow Light (TensorFlow Lite)`,`TensorFlow Lite is Google's dedicated lightweight runtime optimized for on-device inference on Android, iOS, embedded Linux, and microcontroller hardware.`],
[`Which specific file in a standard TensorFlow SavedModel directory is explicitly responsible for maintaining cryptographic hashes to ensure integrity verification during cross-platform model deployment?`,`fingerprint.pb`,`The fingerprint.pb protocol buffer file stores cryptographic digests of the graph, variables, and assets to verify integrity and prevent model corruption across deployments.`]
]},
{t:"Section E: LLM Training and Fine-Tuning",h:330,note:"Options only, no answer key in source",q:[
[`What primary training objective is used during the pretraining stage of Large Language Models (LLMs)?`,[`Masked token prediction`,`Next-token prediction`,`Contrastive sequence matching`,`Direct preference optimization`]],
[`Which adaptation approach modifies external retrieved context rather than updating any internal model parameters`,[`Parameter-Efficient Fine-Tuning (PEFT)`,`Retrieval-Augmented Generation (RAG)`,`Supervised Fine-Tuning (SFT)`,`Low-Rank Adaptation (LoRA)`]],
[`Beyond model parameters, which component often contributes significantly to memory overhead during full model fine-tuning?`,[`Static input token IDs`,`Tokenizer vocabulary lookup tables`,`Fixed positional embedding matrices`,`Optimizer states and gradients`]],
[`What primary operation converts input text into subword units before fed into an LLM embedding layer?`,[`Tokenization`,`Normalization`,`Quantization`,`De-noising`]],
[`What is the primary benefit of utilizing Brain Float 16 (BF16) over conventional Floating Point 16 (FP16) when training large transformer models?`,[`It uses fewer total bits to store numerical values.`,`It has a wider exponent range.`,`It automatically applies gradient scaling routines.`,`It can safely downcast the final output tensors.`]],
[`How can the numerical issue of naive softmax calculations blowing up into "Not a Number" (NaN) or infinity be successfully stabilized?`,[`By manually calling a blanket model.half() function.`,`By switching the target system architecture to a legacy GPU.`,`By executing the backward pass within an autocast region.`,`By subtracting the maximum value from the logits before softmax.`]],
[`What occurs when tiny gradients flush directly to zero during the training process, and what symptom describes this state?`,[`Underflow, causing the learning process to stall.`,`Underflow, causing the loss function to hit infinity.`,`Overflow, causing the parameters to immediately vanish.`,`Overflow, causing logits to blow up before the softmax`]],
[`Which of the following components has the same shape as the model weights when training an LLM?`,[`Optimizer states`,`Gradients`,`Activations`,`Framework overhead`]],
[`What is the primary trade-off involved when implementing gradient checkpointing in LLM training?`,[`Trading compute for memory`,`Trading precision for speed`,`Trading accuracy for memory`,`Trading throughput for precision`]],
[`What happens to a weight update step in dynamic loss scaling if an 'inf' or 'nan' value is detected in the gradients?`,[`The update step is skipped entirely.`,`The update step runs with a fixed scale.`,`Only the update of corrupted weights are skipped.`,`The model falls back to full precision.`]],
[`Which parameter-efficient fine-tuning technique is specifically recommended when weight updates are necessary but the memory or GPU budget is highly limited?`,[`Supervised Fine-Tuning (SFT)`,`Continued Pre-training (CPT)`,`Low-Order Rank Adaptation (LoRA)`,`Zero-Shot Generation`]],
[`What major limitation was observed when testing the base, pre-trained GPT-2 model using a zero-shot generation prompt?`,[`It did not know how to follow the specified instruction format.`,`It failed to generate grammatically correct English sentences.`,`It was unable to process abstract concepts like networks.`,`It completely refused to output text due to policy constraints.`]],
[`When setting up a model's weights to be frozen so that the backward pass does not update them during training, which configuration must be applied?`,[`requires_grad = False`,`requires_grad = True`,`double_quantization = True`,`optimizer_state = True`]],

{t:"Section I: Intelligent Video Analytics (IVA)",h:5,note:"Options only, no answer key in source",q:[
[`In the overall Intelligent Video Analytics (IVA) pipeline architecture, what is the specific role of the Large Language Model (LLM) component?`,[`It determines if an event occurred directly from raw video frames.`,`It acts as the primary multi-object detector and tracker.`,`It generates natural language reports after deterministic event analysis.`,`It replaces the event logic layer to reduce end-to-end latency.`]],
[`Architecturally, why are raw bounding boxes from object detectors considered an intermediate representation rather than the ultimate goal of an Intelligent Video Analytics system?`,[`Bounding boxes are stored as uncompressed, high-bandwidth raw files.`,`Final application goals require structured data for decision support.`,`Bounding boxes lack geometric coordinate values like center points.`,`Object detectors cannot assign class labels or confidence scores.`]],

[`How does the ByteTrack algorithm preserve track continuity during temporary occlusions or motion blurs?`,[`It skips low-confidence detections and uses interpolation.`,`It uses low-confidence detections in a second association step.`,`It creates a brand-new track ID for every blurry frame.`,`It sends occluded frames to the LLM for re-identification.`]],
[`Why are Region of Interest (ROI) polygon points stored as normalized coordinates between 0 and 1?`,[`They allow site-specific semantic context to be learned automatically by the model.`,`They preserve the relative spatial placement across varying video resolution sizes.`,`They decrease error rates when calculating bounding box center locations.`,`They accelerate feature extraction times during real-time frame processing.`]],
[`How does the event engine establish that a valid "Restricted Zone Entry" transition event has occurred?`,[`By verifying the bounding box center stays inside the polygon for a fixed time.`,`By evaluating if the object detection confidence score exceeds a given limit.`,`By observing if the tracked class label changes upon reaching the polygon edge.`,`By checking if a track was outside in the previous frame and inside currently.`]],
[`What is the primary function of applying a "cooldown interval" within the crowd threshold rule?`,[`To prevent emitting duplicate event alerts continuously across consecutive frames.`,`To clear obsolete object tracking identification records directly out of memory.`,`To maintain track ID persistence whenever severe visual occlusion takes place.`,`To automatically reset dwell time counters as soon as a new person joins.`]],
[`Why is the .jsonl (JSON Lines) format utilized for outputting system event logs?`,[`It reduces frame storage requirements by compressing raw video pixel streams.`,`It permits appending individual event records continuously as real-time streams.`,`It converts unstructured raw images straight into plain English sentences.`,`It allows language models to evaluate frame data without validation steps.`]],
[`In this system architecture, what role is the Large Language Model (LLM) restricted to performing?`,[`Detecting and classifying visual targets directly from original video inputs.`,`Modifying line-crossing detection threshold parameters during peak periods.`,`Summarizing structured incident logs into reports without inventing new events.`,`Correcting misclassifications produced by lower-level object tracking layers.`]],
[`Why is evaluating only the YOLO model's inference latency insufficient for assessing the performance of a complete Intelligent Video Analytics (IVA) pipeline?`,[`Model inference times vary drastically depending on the input frame resolution.`,`Neural network inference speed is inherently isolated from memory utilization.`,`Object detection accuracy metrics do not correlate with frame rendering rates.`,`Other stages like decoding, tracking, or drawing may dominate total processing time.`]]
